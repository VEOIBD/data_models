# This workflow is used to update gh-pages content by running an R workflow when
# changes occur to ark.model.csv in the main branch

name: ci gh-pages content update

on:
  push:
    branches: ["gh-pages", "curator_extension"]
    paths:
      - '.github/workflows/ci-gh-pages.yml'
      - '_utils/update_site_content.R'
      - 'model_templates/**'
      - 'veoibd.model.csv'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  update:
    name: Update site content
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.VEOIBD_SERVICE_ACCOUNT }}

    steps:
      - name: Setup R env
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: '4.3.3'

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::stringr
            any::glue
            any::purrr
            any::snakecase
            any::rlang
            any::remotes
            any::lubridate
            any::openxlsx

      - name: Checkout gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          token: ${{ secrets.VEOIBD_SERVICE_ACCOUNT }}

      - name: Checkout other branch
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }} # Checkout the same repository
          ref: curator_extension # Specify the branch you want to access
          path: main # Checkout into a different directory
          token: ${{ secrets.VEOIBD_SERVICE_ACCOUNT }}

      - name: Update site content
        run: |
          Rscript _utils/update_site_content.R

      - name: Clean up before commit
        run: |
          rm -Rf main/

      - name: Commit files if there are changes
        run: |
          if [[ $(git diff --exit-code) ]]; then
            echo "Changes in site content detected and will be committed."
            git config --local user.name "veoibd-service-account"
            git config --local user.email "veoibd-service-account@users.noreply.github.com"
            git add .
            git commit -m "GitHub Action: update data dictionary site content"
          else
            echo "Push to branch did not change site content, nothing to commit"
          fi

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.VEOIBD_SERVICE_ACCOUNT }}
          branch: gh-pages
          force: true